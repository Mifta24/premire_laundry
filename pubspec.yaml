name: premire_laundry
description: "Premier Laundry - Aplikasi Laundry Mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.4
  go_router: ^14.8.1
  provider: ^6.1.2
  geolocator: ^13.0.4
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  http: ^1.2.0
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  pdf: ^3.11.3
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#1565FF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#1565FF"
    theme_color: "#1565FF"

flutter_native_splash:
  color: "#F5F7FB"
  image: "assets/branding/splash_logo.png"
  android_12:
    image: "assets/branding/app_icon_foreground.png"
    icon_background_color: "#1565FF"
    color: "#F5F7FB"
  android: true
  ios: true
  web: false
